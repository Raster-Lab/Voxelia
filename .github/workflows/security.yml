name: Security

on:
  schedule:
    - cron: '31 19 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scaffold:
    runs-on: [self-hosted, macOS, ARM64, voxelia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert Apple Silicon environment
        run: Tools/Scripts/assert-apple-platform.sh
      - name: Reject obvious credential files
        run: |
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' \) | grep .
      - name: Enforce Swift safety policy
        run: python3 Tools/Scripts/check_swift_safety.py --compile
