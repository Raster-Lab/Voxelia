name: Platform Builds

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.github/workflows/platform-builds.yml'
      - 'Tools/Scripts/test-platforms.sh'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-platforms:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, voxelia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert Apple Silicon environment
        run: Tools/Scripts/assert-apple-platform.sh
      - name: Generate Xcode package project and build platforms
        run: Tools/Scripts/test-platforms.sh
