name: Release Gate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: [self-hosted, macOS, ARM64, voxelia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert Apple Silicon environment
        run: Tools/Scripts/assert-apple-platform.sh
      - run: Tools/Scripts/prepare-release.sh
      - name: Verify release metadata
        run: |
          test -s CHANGELOG.md
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
