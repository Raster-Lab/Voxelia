name: Validation Smoke

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Validation/**'
      - 'Tools/Scripts/validation-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, voxelia]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert Apple Silicon environment
        run: Tools/Scripts/assert-apple-platform.sh
      - run: Tools/Scripts/validation-smoke.sh
