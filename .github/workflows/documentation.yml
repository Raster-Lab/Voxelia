name: Documentation

on:
  pull_request:
    paths:
      - '.github/workflows/documentation.yml'
      - 'docs/**'
      - 'Package.swift'
      - 'Sources/**/*.swift'
      - 'Sources/**/*.docc/**'
      - 'Tools/Scripts/assert-apple-platform.sh'
      - 'Tools/Scripts/build-docc.sh'
      - 'Tools/Scripts/check_adr_register.py'
      - 'Tools/Scripts/check_docc_archives.py'
      - 'Tools/Scripts/check_document_text.py'
      - 'Tools/Scripts/check_front_matter.py'
      - 'Tools/Scripts/check_rfc_register.py'
      - 'Tools/Scripts/generate_requirement_index.py'
      - 'Tools/Scripts/validate-docs.sh'
      - 'README.md'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, voxelia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert Apple Silicon environment
        run: Tools/Scripts/assert-apple-platform.sh
      - run: Tools/Scripts/validate-docs.sh
      # Runs here rather than inside validate-docs.sh: one of these tests
      # executes validate-docs.sh as a subprocess, so calling them from it
      # recurses without bound. `ADR-0289` records that, and records why these
      # ran nowhere until now -- seven of a hundred and fifty were failing,
      # four of them broken two increments earlier by a change to the very
      # checker they test.
      - name: Repository script regression tests
        run: Tools/Scripts/test-repository-scripts.sh
      - name: Build DocC documentation
        run: Tools/Scripts/build-docc.sh
