name: Nightly Validation

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: [self-hosted, macOS, ARM64, voxelia]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert Apple Silicon environment
        run: Tools/Scripts/assert-apple-platform.sh
      - run: Tools/Scripts/validate-scaffold.sh
      - run: swift test --package-path Validation
